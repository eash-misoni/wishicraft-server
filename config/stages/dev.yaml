schema_version: 1
stage: dev

aws:
  account_id: "385526546525"
  region: ap-northeast-1
  availability_zone: ap-northeast-1a

network:
  minecraft_port: 25565
  rcon_port: 25575

compute:
  architecture: x86_64
  instance_type: t3a.medium
  operating_system: amazon-linux-2023
  java_runtime: corretto-25-headless
  minecraft_version: "26.2"
  java_xms: 1G
  java_xmx: 3G

minecraft_distribution:
  server_jar_url: https://piston-data.mojang.com/v1/objects/823e2250d24b3ddac457a60c92a6a941943fcd6a/server.jar
  server_jar_sha1: 823e2250d24b3ddac457a60c92a6a941943fcd6a
  server_jar_sha256: cdacdfb25898de5e4b4b0e5ddcc2722f77067e46605709c2d886c000ebb63ec5
  server_jar_size: 60894273

storage:
  root:
    volume_type: gp3
    size_gib: 16
    encrypted: true
  data:
    volume_type: gp3
    size_gib: 30
    encrypted: true
    retain_on_delete: true
    filesystem_type: xfs
    mount_path: /srv/minecraft

route53:
  hosted_zone_id: Z077818024BJUAUBFMTKV
  record_name: mc-dev.wishicraft.net
  # record type/TTL/delete policyはconfig/project.yamlのdomainを使用する。

discord:
  environment_label: test
  bot_display_name: "ゐしクラくん Dev"
  command_scope: guild
  guild_id: "1251169327554625757"
  operation_channel_id: "1531883129525244015"
  admin_channel_id: "1531883269639897098"
  player_role_id: "1531883392205983765"
  admin_role_id: "1531883595113697410"
  application_id: "1531887197433757768"
  public_key: "235531769c715d8d9b419920318f3d4bbef5c9e09b866dc4099de8940d1a40e1"

timeouts_seconds:
  ec2_running: 300
  ssm_online: 300
  minecraft_ready: 600
  minecraft_normal_stop: 180
  ec2_stopped: 300
  route53_insync: 120
  ssm_probe: 60
  start_workflow: 1800
  stop_workflow: 1200
  status: 120
  backup: 900

operation:
  global_lock_name: minecraft-control
  lock_lease_seconds: 900
  lock_renew_interval_seconds: 120

runtime:
  idle_shutdown_minutes: 30

# Phase 2 target Host Runtime lock. Phase 1 compute/java/artifact values above remain as-built.
host_runtime:
  platform:
    operating_system: amazon-linux-2023
    al2023_release: "2023.12.20260724"
    ami_name: null # Observation Required with the region-specific AMI ID.
    ami_id: null # Observation Required before any AWS/EC2 application.
    architecture: x86_64
  compose:
    version: "5.4.0"
    url: https://github.com/docker/compose/releases/download/v5.4.0/docker-compose-linux-x86_64
    sha256: 837fd1d35bf6a494f41b5b5988269a7be79de337cf1a1a6ff0e45ab51bb4e9be
  image:
    reference: ghcr.io/itzg/minecraft-server:2026.7.2-java25@sha256:6ec1110e4d9236d00ae9436a3e4a5929583e5b19cc94b756a7c603f7cf647a77
    release: 2026.7.2
    java_variant: java25
  minecraft:
    version: "26.2"
    type: VANILLA
    eula_accepted: true
  identity:
    uid: null # Observation Required from the existing data EBS.
    gid: null # Observation Required from the existing data EBS.
    skip_chown_data: true
  memory:
    container_limit: 2816MiB
    jvm_initial: 1G
    jvm_maximum: 2G
  timeouts:
    explicit_save: 60
    itzg_stop_duration: 120
    compose_stop_grace_period: 150
    systemd_stop: 180
    host_runtime_wrapper: 300
    ssm: 360
    control_plane_wait: 420

billing:
  dynamodb_mode: on_demand

monitoring:
  monthly_budget_usd: 15
  budget_threshold_percentages:
    - 50
    - 80
    - 100
  notify_forecasted_100_percent: true
  ec2_running_warning_hours: 8
  desired_stopped_ec2_running_warning_minutes: 15
  desired_running_not_ready_warning_minutes: 20
  log_retention_days: 14
