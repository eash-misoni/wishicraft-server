[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wishicraft-server"
version = "0.1.0"
description = "Wishicraft server control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aws-cdk-lib>=2.0,<3.0",
  "constructs>=10.0,<11.0",
  "pynacl==1.6.2",
  "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wishicraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "infrastructure", "tests"]
