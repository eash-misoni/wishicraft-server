name: Paper same-runtime import integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pinned-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: tools/dev-env run -- uv sync --frozen --all-groups
      - run: sudo --preserve-env=CI .venv/bin/python tests/integration/paper_import_docker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-import-evidence
          path: |
            /tmp/wishicraft-paper-import-*/*.log
            /tmp/wishicraft-paper-import-*/result.json
          retention-days: 14
