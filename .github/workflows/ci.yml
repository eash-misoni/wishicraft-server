name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration bundle tests compare the exact deployed predecessor commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: tools/dev-env run uv sync --frozen --all-groups
      - run: tools/dev-env run npm ci
      - run: tools/dev-env check
      - run: tools/dev-env run uv run pytest
      - run: tools/dev-env run uv run ruff check .
      - run: tools/dev-env run uv run ruff format --check .
      - run: tools/dev-env run uv run mypy src infrastructure tests web
      - run: >-
          tools/dev-env run npx --no-install cdk synth MinecraftStack-dev
          --context stage=dev --context phase=1 --context deployment=phase1
      - run: >-
          tools/dev-env run npx --no-install cdk synth MinecraftTargetStack-dev
          --context stage=dev --context deployment=target
      - name: Legacy Control Plane regression
        run: >-
          tools/dev-env run npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context validation_action=synth --context daily_backup_validation=legacy --context retention_validation=disabled
      - name: Legacy Control Plane regression
        run: >-
          tools/dev-env run npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true
          --context validation_action=synth --context daily_backup_validation=legacy --context retention_validation=disabled
      - name: Legacy Control Plane regression
        run: >-
          tools/dev-env run npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true --context reset=true --context game_creation=true
          --context validation_action=synth --context daily_backup_validation=legacy --context retention_validation=disabled
      - name: Canonical stage Control Plane (current release context)
        run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true --context reset=true --context game_creation=true
          --context whitelist_management=true --context game_packages=true
      - name: Future retention provisioned (synth only)
        run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true --context reset=true --context game_creation=true
          --context whitelist_management=true --context game_packages=true
          --context validation_action=synth --context retention_validation=provisioned
      - name: Future retention enabled (synth only)
        run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true --context reset=true --context game_creation=true
          --context whitelist_management=true --context game_packages=true
          --context validation_action=synth --context retention_validation=enabled
      - name: Enabled daily BACKUP validation (stage B)
        run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true --context reset=true --context game_creation=true
          --context whitelist_management=true --context game_packages=true
          --context validation_action=synth --context daily_backup_validation=enabled --context retention_validation=disabled
      - run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftWebStack-dev
          --context stage=dev --context phase=8 --context deployment=web
      - name: Legacy Control Plane regression
        run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev
          --context stage=dev --context phase=8 --context deployment=control-plane
          --context two_games=true --context reset=true --context game_creation=true --context whitelist_management=true
          --context validation_action=synth --context daily_backup_validation=legacy --context retention_validation=disabled
      - run: >-
          tools/dev-env run -- npx --no-install cdk synth WishicraftWebStack-dev
          --context stage=dev --context phase=8 --context deployment=web
          --context game_creation=true --context whitelist_management=true
      - run: >-
          shellcheck infrastructure/host_runtime/docker_compose_install.sh
          infrastructure/host_runtime/target_host_validation.sh
          tools/dev-env tools/setup-dev-tools

  user-guide-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: tools/dev-env run -- uv sync --frozen --all-groups
      - run: tools/dev-env run -- npm ci
      - run: tools/dev-env check
      - run: tools/dev-env run -- npx --no-install playwright --version
      - run: tools/dev-env run -- npx --no-install playwright install --with-deps chromium
      - name: Build reviewed files and verify in Chromium (no publication)
        run: |
          GUIDE_ROOT=$(mktemp -d)
          tools/dev-env run -- uv run python -m web.build --output "$GUIDE_ROOT/site"
          tools/dev-env run -- node web/browser-check.mjs "$GUIDE_ROOT/site"
          tools/dev-env run -- node web/foundation-browser.mjs
          tools/dev-env run -- node web/operations-browser.mjs
          tools/dev-env run -- node web/whitelist-browser.mjs

  host-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck integration harness
        run: shellcheck tests/integration/test_itzg_ownership.sh
      - name: Verify fixed itzg image and synthetic ownership migration
        run: tests/integration/test_itzg_ownership.sh
      - name: Verify targeted STOP removal and next START with real Docker
        run: |
          command -v python3
          python3 --version
          python3 tests/integration/targeted_runtime_docker.py
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify rendered shared memory with real Docker and JVM arguments
        run: tools/dev-env run -- uv run python tests/integration/targeted_runtime_docker.py --memory
      - name: Verify A to B to A with real Docker under one warm host
        run: sudo --preserve-env=CI python3 tests/integration/targeted_runtime_docker.py --two-games

      - name: Verify game-scoped Reset and limited world cleanup with real Docker
        run: sudo --preserve-env=CI python3 tests/integration/targeted_runtime_docker.py --reset

      - name: Verify metadata creation and first START/SWITCH with real Docker
        run: sudo --preserve-env=CI python3 tests/integration/targeted_runtime_docker.py --creation

      - name: Verify authoritative Whitelist and Minecraft command convergence
        run: sudo --preserve-env=CI python3 tests/integration/targeted_runtime_docker.py --whitelist

      - name: Verify Common and Game policy through real Reset generations
        run: sudo --preserve-env=CI python3 tests/integration/targeted_runtime_docker.py --whitelist-reset

  lambda-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: tools/dev-env run -- uv sync --frozen --all-groups
      - run: tools/dev-env run -- npm ci
      - name: Synthesize actual canonical assets and historical deployed source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .:src
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          ARTIFACT_ROOT=$(mktemp -d)
          echo "ARTIFACT_ROOT=$ARTIFACT_ROOT" >> "$GITHUB_ENV"
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev --output "$ARTIFACT_ROOT/current" --context stage=dev --context phase=8 --context deployment=control-plane --context two_games=true --context reset=true --context game_creation=true --context whitelist_management=true --context game_packages=true
          tools/dev-env run -- npx --no-install cdk synth WishicraftWebStack-dev --output "$ARTIFACT_ROOT/web" --context stage=dev --context phase=8 --context deployment=web --context game_creation=true --context whitelist_management=true
          tools/dev-env run -- uv run python -m tests.artifact.export_fixtures "$ARTIFACT_ROOT/recovery.json"
          git worktree add --detach "$ARTIFACT_ROOT/old" 51fa628179c43c2ca1559077d3b196e9797822e9
          ln -s "$GITHUB_WORKSPACE/.venv" "$ARTIFACT_ROOT/old/.venv"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$ARTIFACT_ROOT/old/node_modules"
          cd "$ARTIFACT_ROOT/old"
          tools/dev-env run -- npx --no-install cdk synth WishicraftControlPlaneStack-dev --output "$ARTIFACT_ROOT/previous" --context stage=dev --context phase=8 --context deployment=control-plane --context two_games=true --context reset=true --context game_creation=true --context whitelist_management=true --context game_packages=true
      - name: Mandatory Python 3.12 Linux artifact isolation (no credentials or network)
        run: >-
          tools/dev-env run -- uv run python tests/artifact/run.py
          --assembly "$ARTIFACT_ROOT/current" --assembly "$ARTIFACT_ROOT/web"
          --old-assembly "$ARTIFACT_ROOT/previous" --fixture "$ARTIFACT_ROOT/recovery.json"
          --output "$ARTIFACT_ROOT/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-artifact-evidence
          path: |
            ${{ env.ARTIFACT_ROOT }}/results/evidence.json
            ${{ env.ARTIFACT_ROOT }}/results/probe-*.jsonl
          if-no-files-found: error
